# Black Metal theme by metalelf0
background  #000000
foreground  #ffffff
cursor      #ffffff
selection_foreground #000000
selection_background #ffffff
color0   #000000
color1   #5f8787
color2   #dd9999
color3   #a06666
color4   #888888
color5   #999999
color6   #aaaaaa
color7   #c1c1c1
color8   #333333
color9   #5f8787
color10  #dd9999
color11  #a06666
color12  #888888
color13  #999999
color14  #aaaaaa
color15  #c1c1c1

# Quickshell can override above when it generates a theme
include ~/.local/state/quickshell/user/generated/terminal/kitty-theme.conf

# Font
font_family      JetBrains Mono Nerd Font
font_size 11.0

# Tab bar — minimal dots style
tab_bar_style custom
tab_bar_edge bottom
tab_bar_background none
tab_bar_margin_height 5 0
active_tab_foreground #ffffff
active_tab_background #000000
active_tab_font_style bold
inactive_tab_foreground #666666
inactive_tab_background #000000
inactive_tab_font_style normal

# Cursor
cursor_shape beam
cursor_trail 0

# Padding
window_padding_width 8
window_margin_width 0
single_window_margin_width 8
window_border_width 0.5pt
active_border_color #5f8787
inactive_border_color #333333

# No stupid close confirmation
confirm_os_window_close 0

# Scrollback
scrollback_lines 50000

# Bell notification
enable_audio_bell no
visual_bell_duration 0
window_alert_on_bell yes
bell_on_tab "● "
command_on_bell notify-send -u normal "Terminal bell" "Bell in kitty"

# Shell
shell zsh

# Open file paths from terminal output (Ctrl+Shift+E)
map ctrl+shift+e kitten hints --type path --program -

# Open file paths in editor (Ctrl+Shift+O)
map ctrl+shift+o kitten hints --type path

# Clickable URLs
mouse_map ctrl+left press ungrabbed,grabbed mouse_click_url

# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Toggle zoom (expand split to full window and back)
map ctrl+shift+z toggle_layout stack

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
